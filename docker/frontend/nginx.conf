# Nginx配置 - 闲鱼自动回复系统前端

# API 限流区：10r/s，burst 20（防暴力破解与简单 CC）
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    # 容器内以非 root 用户运行（nginx-unprivileged），监听非特权端口 8080
    listen 8080;
    server_name localhost;

    # 根目录
    root /usr/share/nginx/html;
    index index.html;

    # ====== 安全响应头 ======
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # CSP：React SPA + Vite 构建产物（无内联脚本，主题初始化脚本已外置为 /theme-init.js）；
    # style 允许 unsafe-inline（React 组件大量内联 style 属性 + Tailwind）；
    # 字体/样式表允许 Google Fonts（index.html 引入）；connect 放行 API 与 WebSocket
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' ws: wss: http: https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
    gzip_comp_level 6;

    # 前端静态资源缓存（构建产物hash文件名）
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API代理到后端服务
    location /api {
        # 简单限流：超过 10r/s 排队至 burst 20，再超返回 503
        limit_req zone=api_limit burst=20 nodelay;
        client_max_body_size 50m;
        proxy_pass http://backend-web:8089;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_connect_timeout 75s;
    }

    # 后端健康检查代理
    location /health {
        proxy_pass http://backend-web:8089/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 后端静态文件代理（上传的图片、群二维码等，覆盖整个 /static）
    location /static {
        proxy_pass http://backend-web:8089/static;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA路由支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
