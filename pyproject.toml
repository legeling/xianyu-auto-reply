[project]
name = "xianyu-auto-reply"
version = "2.2.0"
description = "闲鱼自动回复系统 - 企业级多用户版本"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # 核心Web框架
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    
    # 日志记录
    "loguru>=0.7.0",
    
    # 网络通信
    "websockets>=10.0,<13.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    
    # 配置文件处理
    "PyYAML>=6.0.0",
    
    # JavaScript执行引擎
    "PyExecJS>=1.5.1",
    
    # 协议缓冲区解析
    "blackboxprotobuf>=1.0.1",
    
    # 系统监控
    "psutil>=5.9.0",
    
    # 文件上传支持
    "python-multipart>=0.0.6",
    
    # AI回复引擎
    "openai>=1.50.0",
    
    # 图像处理
    "Pillow>=10.0.0",
    "qrcode[pil]>=7.4.2",
    
    # 浏览器自动化
    "playwright>=1.40.0",
    "DrissionPage>=4.0.0",
    
    # 加密和安全
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=41.0.0",
    
    # 时间处理
    "python-dateutil>=2.8.2",
    
    # Excel文件处理
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    
    # 邮件发送
    "email-validator>=2.0.0",
    
    # 数据处理和验证
    "xlsxwriter>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
build = [
    "nuitka>=2.7",
    "ordered-set>=4.1.0",
    "zstandard>=0.22.0",
]

[project.scripts]
xianyu-cli = "xianyu_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.black]
line-length = 120
target-version = ["py311"]
